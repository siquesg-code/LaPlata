[tool.poetry]
name = "ai-admin-agent"
version = "0.1.0"
description = "AI-powered business administration assistant"
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = ">=0.30"}
sqlalchemy = ">=2.0"
aiosqlite = ">=0.20"
pydantic = ">=2.0"
openai = ">=1.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
